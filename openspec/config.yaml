schema: spec-driven

context: |
  Language: Spanish
  All artifacts must be written in Spanish, following openspec/project.md.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English where required by the schema.
  Preserve the approved modular layered architecture and stack in the project context.
  Do not invent institutional policy; keep undecided rules explicit until approved.
  Do not implement behavior before its specification has been reviewed and approved.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
